[package]
name = "x-sentinel"
version = "1.3.5"
edition = "2024"
description = "Autonomous Multi-Node Fleet Cockpit & Growth Studio for X"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
askama = "0.16.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "limit", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
scrypt = "0.11"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
qrcode = "0.14"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures-util = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
