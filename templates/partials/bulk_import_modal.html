<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="bulk-modal-title">
  <div class="modal-panel stack-md">
    <div class="row-between">
      <h2 id="bulk-modal-title">Bulk import nodes</h2>
      <button type="button" class="btn btn--ghost btn--icon" @click="closeModal" aria-label="Close modal">
        <svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-x"></use></svg>
      </button>
    </div>

    <p class="text-soft">Paste one entry per line (`auth_token:ct0:label` or `auth_token|ct0|proxy|label`) or a JSON array of account objects.</p>

    <form class="stack-md"
          hx-post="/partials/accounts/bulk-import"
          hx-target="#nodes-list"
          hx-swap="innerHTML">
      <div class="field">
        <label for="bulk-raw-text" class="field-label">Account tokens payload</label>
        <textarea id="bulk-raw-text" name="raw_text" class="textarea control--mono" placeholder="a1b2c3...:ct0_xyz...:Node 1" required></textarea>
      </div>
      <div class="row-between">
        <button type="button" class="btn btn--ghost" @click="closeModal">Cancel</button>
        <button type="submit" class="btn btn--primary btn--mobile-full">Import nodes</button>
      </div>
    </form>
  </div>
</div>
