{% if schedules.is_empty() %}
<p class="field-hint">No scheduled tasks queued.</p>
{% else %}
<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Timing</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for s in schedules %}
      <tr>
        <td>{{ s.title }}</td>
        <td class="mono">{{ s.schedule_type }}</td>
        <td class="mono">{{ s.timing_label }}</td>
        <td>
          <span class="pill {{ s.status_pill_class }}">{{ s.status_label }}</span>
        </td>
        <td>
          <div class="row-wrap">
            <button type="button" class="btn btn--ghost btn--sm"
                    hx-post="/partials/schedules/{{ s.id }}/toggle"
                    hx-target="#composer-queue-slot"
                    hx-swap="innerHTML">
              {% if s.enabled %}Pause{% else %}Enable{% endif %}
            </button>
            <button type="button" class="btn btn--danger btn--sm"
                    hx-delete="/partials/schedules/{{ s.id }}"
                    hx-target="#composer-queue-slot"
                    hx-swap="innerHTML">Delete</button>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
