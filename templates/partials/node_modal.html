<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="node-modal-title">
  <div class="modal-panel stack-md"
       x-data="accountModalForm"
       data-init-token="{{ auth_token }}"
       data-init-ct0="{{ ct0 }}"
       data-init-proxy="{{ proxy }}">
    <div class="row-between">
      <h2 id="node-modal-title">{% if is_edit %}Edit node{% else %}Add X account node{% endif %}</h2>
      <button type="button" class="btn btn--ghost btn--icon" @click="closeModal" aria-label="Close modal">
        <svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-x"></use></svg>
      </button>
    </div>

    <div class="frag stack-sm">
      <label for="cookie-smart-input" class="field-label">Smart cookie extractor</label>
      <textarea id="cookie-smart-input"
                class="textarea control--mono"
                x-model="cookieRaw"
                placeholder="Paste JSON cookies array, Netscape rows, or Cookie header string..."></textarea>
      <div class="row-wrap">
        <button type="button" class="btn btn--ghost btn--sm" @click="extractCookies">Parse auth_token &amp; ct0</button>
      </div>
    </div>

    <form class="stack-md"
          {% if is_edit %}
          hx-post="/partials/accounts/{{ id }}/update"
          {% else %}
          hx-post="/partials/accounts/create"
          {% endif %}
          hx-target="#nodes-list"
          hx-swap="innerHTML">
      <div class="field">
        <label for="node-label" class="field-label">Node label</label>
        <input id="node-label" name="label" type="text" class="control" value="{{ label }}" placeholder="Alpha Node 01" />
      </div>

      <div class="field">
        <label for="node-auth-token" class="field-label">auth_token cookie</label>
        <input id="node-auth-token" name="auth_token" type="text" class="control control--mono" x-model="authToken" required />
      </div>

      <div class="field">
        <label for="node-ct0" class="field-label">ct0 CSRF token</label>
        <input id="node-ct0" name="ct0" type="text" class="control control--mono" x-model="ct0" />
      </div>

      <div class="field">
        <label for="node-proxy" class="field-label">Dedicated proxy tunnel (optional)</label>
        <div class="row-wrap">
          <input id="node-proxy" name="proxy" type="text" class="control control--mono" x-model="proxy" placeholder="user:pass@ip:port or socks5://user:pass@ip:port" />
          <button type="button" class="btn btn--ghost btn--sm" @click="runProxyTest" :disabled="testingProxy">Test proxy</button>
        </div>
        <div x-show="hasProxyStatus" :class="proxyAlertClass" x-text="proxyStatus"></div>
      </div>

      <div class="row-between">
        <button type="button" class="btn btn--ghost" @click="closeModal">Cancel</button>
        <button type="submit" class="btn btn--primary btn--mobile-full">
          {% if is_edit %}Save node changes{% else %}Create node{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
