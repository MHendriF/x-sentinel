<section data-active-tab="analytics" class="stack-lg">
  <div class="tab-header">
    <div>
      <h1>Analytics &amp; telemetry</h1>
      <p class="tab-lead">Inspect engagement velocity, hourly action density, per-node contribution, and error categories.</p>
    </div>
    <div class="tab-actions">
      <form class="row-wrap"
            hx-get="/partials/analytics"
            hx-target="#analytics-body-slot"
            hx-swap="innerHTML"
            hx-trigger="change, submit">
        <label for="analytics-tf" class="sr-only">Timeframe</label>
        <select id="analytics-tf" name="timeframe" class="select">
          <option value="24h" {% if view.timeframe == "24h" %}selected{% endif %}>Last 24h</option>
          <option value="7d" {% if view.timeframe == "7d" %}selected{% endif %}>Last 7 days</option>
          <option value="30d" {% if view.timeframe == "30d" %}selected{% endif %}>Last 30 days</option>
          <option value="all" {% if view.timeframe == "all" %}selected{% endif %}>All time</option>
        </select>

        <label for="analytics-node" class="sr-only">Filter node</label>
        <select id="analytics-node" name="node" class="select">
          <option value="all">All nodes</option>
          {% for acc in accounts %}
          <option value="{{ acc.id }}" {% if view.selected_node_id == acc.id %}selected{% endif %}>{{ acc.label }}</option>
          {% endfor %}
        </select>

        <button type="submit" class="btn btn--ghost">Refresh</button>
      </form>
      <a href="/partials/history/export-csv" class="btn btn--ghost">Export CSV</a>
    </div>
  </div>

  <div id="analytics-body-slot">
    {% include "partials/analytics_body.html" %}
  </div>
</section>
