<form class="frag stack-md" hx-post="/partials/safety/2fa-enable" hx-target="#safety-feedback-slot" hx-swap="innerHTML">
  <div class="row-wrap">
    {% if !qr_svg.is_empty() %}
    <div class="qr-box">{{ qr_svg|safe }}</div>
    {% endif %}
    <div class="stack-sm">
      <span class="field-label">Manual TOTP Base32 secret</span>
      <code class="mono">{{ secret }}</code>
      <span class="field-hint">Scan QR in Authenticator, then enter the 6-digit code below.</span>
    </div>
  </div>
  <input type="hidden" name="secret" value="{{ secret }}" />
  <div class="row-wrap">
    <label for="totp-verify-code" class="sr-only">6-digit code</label>
    <input id="totp-verify-code" name="code" type="text" maxlength="6" pattern="[0-9]{6}" placeholder="000000" class="control control--mono" required />
    <button type="submit" class="btn btn--primary">Verify &amp; enable 2FA</button>
  </div>
</form>
