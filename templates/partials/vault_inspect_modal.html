<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="vault-inspect-title">
  <div class="modal-panel stack-md">
    <div class="row-between">
      <h2 id="vault-inspect-title">Vault file — {{ filename }}</h2>
      <button type="button" class="btn btn--ghost btn--icon" @click="closeModal" aria-label="Close modal">
        <svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-x"></use></svg>
      </button>
    </div>

    <p class="mono text-muted">{{ comments.len() }} template line(s)</p>
    <div class="stack-sm">
      {% for c in comments %}
      <div class="frag text-soft">{{ c }}</div>
      {% endfor %}
    </div>

    <div class="row-between">
      <span class="mono text-muted">Path: data/comments/{{ filename }}</span>
      <button type="button" class="btn btn--ghost" @click="closeModal">Close</button>
    </div>
  </div>
</div>
